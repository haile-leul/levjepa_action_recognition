# LeVJEPA-VideoMix-Large: ViT-L/16, 303M params, 24 blocks, 16 heads.
# Frozen for the whole project. Values below are from the model card.
model_id: galilai-group/LeVJEPA-VideoMix-Large

num_frames: 16
image_size: 224
patch_size: 16
tubelet_size: 1          # one token per frame per patch -> 16 x 14 x 14 patch tokens
embed_dim: 1024

# The HF model takes (B, C, T, H, W). Our data pipeline produces
# (B, T, C, H, W) and the backbone wrapper permutes.
input_layout: BCTHW

# float32 is the safe default. bfloat16 roughly halves memory and is fine for
# feature extraction on recent GPUs.
dtype: float32

# Preprocessing used in pretraining: ImageNet normalisation, 224 crop,
# frames sampled at about 7.5 fps (16 frames ~ 2 seconds of video).
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
target_fps: 7.5          # null = spread the 16 frames over the whole video instead

# There is intentionally no attn_mode here. The checkpoint was trained with
# block-causal attention and that is the default; full attention runs without
# errors but gives worse features. Leave it alone.
